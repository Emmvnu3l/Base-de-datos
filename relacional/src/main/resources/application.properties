spring.application.name=tallerBaseDeDatos.Emmanuel
springdoc.swagger-ui.path=/swagger-ui.html
spring.datasource.url=jdbc:oracle:thin:@TALLERBASEDEDATOST
spring.datasource.username=TALLERBASEDEDATOST
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.open-in-view=false
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=./wallet
